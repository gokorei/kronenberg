name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-15 ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 21 LTS
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build & Run Tests
        run: ./gradlew check test --warning-mode all --no-daemon

      - name: Verify CLI Application Help
        run: ./gradlew :kronenberg-cli:run --args="--help" --warning-mode all --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-${{ matrix.os }}
          path: '**/build/reports/tests/'
          retention-days: 14

  supply-chain:
    name: Supply Chain Verification
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 21 LTS
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Build Project Artifacts
        run: ./gradlew assemble --warning-mode all --no-daemon

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          version: 'v0.74.0'
          scan-type: 'fs'
          scan-ref: 'build'
          format: 'cyclonedx-json'
          output: 'build/reports/kronenberg.cdx.json'
          scanners: 'license'
          exit-code: '0'
          cache: 'false'

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kronenberg-sbom
          path: 'build/reports/kronenberg.cdx.json'
          if-no-files-found: error
          retention-days: 14

      - name: Scan Dependencies for Vulnerabilities
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          version: 'v0.74.0'
          scan-type: 'fs'
          scan-ref: 'build'
          format: 'json'
          output: 'build/reports/trivy-vulnerabilities.json'
          scanners: 'vuln'
          vuln-type: 'library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          cache: 'false'
          skip-setup-trivy: true

      - name: Upload Vulnerability Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kronenberg-vulnerability-report
          path: 'build/reports/trivy-vulnerabilities.json'
          if-no-files-found: warn
          retention-days: 14
