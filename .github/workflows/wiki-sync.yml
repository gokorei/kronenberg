name: Auto-Sync Wiki Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync docs/wiki to GitHub Wiki
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout Wiki Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository }}.wiki
          token: ${{ secrets.GITHUB_TOKEN }}
          path: wiki-repo
        continue-on-error: true

      - name: Sync Markdown Pages & Push to Wiki
        run: |
          if [ -n "$(git -C wiki-repo for-each-ref --format='%(refname:short)' refs/remotes/origin 2>/dev/null)" ]; then
            cp -R docs/wiki/* wiki-repo/
            cd wiki-repo
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            if git status --porcelain | grep -q .; then
              git commit -m "docs: auto-update wiki pages from codebase"
              git push origin master || git push origin main
              echo "Wiki successfully updated."
            else
              echo "No wiki changes detected."
            fi
          else
            echo "Wiki repository not initialized yet. Create the first page at https://github.com/${{ github.repository }}/wiki to initialize it."
          fi
