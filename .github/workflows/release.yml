name: Release

on:
  push:
    tags:
      - 'v*'

env:
  JAVA_VERSION: '21'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 21 LTS
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Verify Build & Tests
        run: ./gradlew check test --warning-mode all --no-daemon

      - name: Build CLI Distribution
        run: ./gradlew :kronenberg-cli:installDist --warning-mode all --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            kronenberg-cli/build/distributions/*.zip
            kronenberg-cli/build/distributions/*.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
